<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="velvet" aria-hidden="true"><i class="glow g1"></i><i class="glow g2"></i></div>

<main id="stage" class="stage">
  <section class="intro" id="intro">
    <p class="for" id="for">یک دعوت‌نامه برای شما</p>
    <div class="env" id="env" role="button" tabindex="0" aria-label="باز کردن دعوت‌نامه">
      <div class="env-back"></div>
      <div class="env-card" id="envCard"><span class="mini-mono" id="miniMono">✦</span></div>
      <svg class="env-pocket" viewBox="0 0 340 234" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--env2)"/><stop offset="1" stop-color="var(--env3)"/></linearGradient></defs>
        <path d="M0 0 L170 128 L340 0 L340 234 L0 234 Z" fill="url(#pk)"/>
        <path d="M0 234 L150 112 M340 234 L190 112" stroke="rgba(0,0,0,.12)" stroke-width="1.2" fill="none"/>
      </svg>
      <div class="env-flap" id="flap">
        <svg viewBox="0 0 340 140" preserveAspectRatio="none" aria-hidden="true"><path class="flap-front" d="M0 0 L340 0 L170 138 Z"/></svg>
      </div>
      <div class="seal" id="seal"><i class="half l"></i><i class="half r"></i><b id="sealMono">✦</b></div>
    </div>
    <p class="tap" id="tap"><span class="ring"></span>برای باز کردن، روی مُهر بزنید</p>
  </section>
</main>
<noscript><p style="color:#fff;text-align:center">برای دیدن دعوت‌نامه، جاوااسکریپت را روشن کنید.</p></noscript>
