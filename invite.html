<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوت‌نامه</title>
<meta name="description" content="یک دعوت‌نامه برای شما — بازش کنید">
<meta property="og:title" content="💌 یک دعوت‌نامه برای شما">
<meta property="og:description" content="بازش کنید">
<meta property="og:image" content="https://leon-gold.github.io/mygirlsparty/og-invite.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#fbe9ee">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/vazirmatn-4.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Vazirmatn"; font-weight: 100 900; font-display: swap; src: url(fonts/vazirmatn-4.woff2) format("woff2"); unicode-range: U+6??, U+750-77F, U+870-891, U+897-8E1, U+8E3-8FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
@font-face { font-family: "Vazirmatn"; font-weight: 100 900; font-display: swap; src: url(fonts/vazirmatn-5.woff2) format("woff2"); unicode-range: U+??, U+131, U+152-153, U+2BB-2BC, U+2C6, U+2DA, U+2DC, U+304, U+308, U+329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root { --a: #c2416b; --b: #ff8a5c; --ink: #3a1d2a; --muted: #8a6a78; --paper: #fffaf6; --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.4, .64, 1); color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { font: 15px/1.8 "Vazirmatn", system-ui, -apple-system, Tahoma, sans-serif; color: var(--ink); overflow-x: hidden;
  background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--a) 22%, #fff), transparent 70%), radial-gradient(90% 60% at 100% 100%, color-mix(in srgb, var(--b) 24%, #fff), transparent 70%), #fdf2f0;
  min-height: 100dvh; -webkit-tap-highlight-color: transparent; }

/* petals: an outer layer falls, an inner layer sways and spins (transform only) */
.petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.petal { position: absolute; top: -40px; animation: fall linear infinite; }
.petal i { display: block; width: var(--s, 16px); height: calc(var(--s, 16px) * 1.25); border-radius: 80% 0 80% 0; opacity: .85;
  background: radial-gradient(120% 90% at 30% 20%, #fff 0%, color-mix(in srgb, var(--a) 35%, #ffd6e2) 45%, color-mix(in srgb, var(--a) 70%, #ff9fb8) 100%);
  box-shadow: inset -2px -2px 4px rgba(150, 30, 70, .15); animation: sway ease-in-out infinite alternate; }
@keyframes fall { to { transform: translateY(110vh); } }
@keyframes sway { from { transform: translateX(-26px) rotate(0deg) rotateY(0deg); } to { transform: translateX(26px) rotate(220deg) rotateY(180deg); } }

.stage { position: relative; z-index: 1; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px 40px; perspective: 1200px; }
.hint { text-align: center; color: var(--muted); font-size: 14px; margin-top: 18px; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* envelope */
.env { position: relative; width: min(340px, 88vw); aspect-ratio: 1.45; cursor: pointer; transform-style: preserve-3d; animation: arrive .9s var(--spring) both; }
@keyframes arrive { from { opacity: 0; transform: translateY(60px) rotate(-6deg) scale(.9); } }
.env .back { position: absolute; inset: 0; border-radius: 14px; background: linear-gradient(160deg, color-mix(in srgb, var(--a) 80%, #fff), var(--a)); box-shadow: 0 24px 50px -18px rgba(120, 30, 60, .55); }
.env .front { position: absolute; inset: 0; border-radius: 14px; z-index: 3;
  background: linear-gradient(to top right, color-mix(in srgb, var(--a) 92%, #000) 49.6%, transparent 50%) left / 50.5% 100% no-repeat,
              linear-gradient(to top left, color-mix(in srgb, var(--a) 88%, #000) 49.6%, transparent 50%) right / 50.5% 100% no-repeat; }
.env .flap { position: absolute; top: 0; left: 0; right: 0; height: 58%; z-index: 4; transform-origin: top center; transition: transform .7s var(--ease) .05s;
  clip-path: polygon(0 0, 100% 0, 50% 100%); background: linear-gradient(to bottom, color-mix(in srgb, var(--a) 70%, #fff), color-mix(in srgb, var(--a) 95%, #000)); border-radius: 14px 14px 0 0; }
.env .seal { position: absolute; z-index: 5; top: 46%; left: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--b) 60%, #fff), var(--b) 60%, color-mix(in srgb, var(--b) 70%, #000)); color: #fff; font-size: 24px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .25), inset 0 0 0 3px rgba(255, 255, 255, .25); transition: transform .4s var(--ease), opacity .3s; }
.env .peek { position: absolute; z-index: 2; inset: 8% 7% 10%; border-radius: 10px; background: var(--paper); transition: transform .8s var(--ease) .45s; }
.env.open .flap { transform: rotateX(180deg); z-index: 1; }
.env.open .seal { transform: scale(0) rotate(90deg); opacity: 0; }
.env.open .peek { transform: translateY(-55%); }
.env.gone { animation: away .6s var(--ease) forwards; }
@keyframes away { to { opacity: 0; transform: translateY(40px) scale(.92); } }

/* the letter */
.letter { width: min(440px, 94vw); background: var(--paper); border-radius: 22px; padding: 30px 24px 26px; position: relative; z-index: 6;
  box-shadow: 0 30px 70px -26px rgba(120, 30, 60, .5), 0 0 0 1px rgba(194, 65, 107, .08); animation: unfold 1s var(--ease) both;
  background-image: radial-gradient(circle at 100% 0, color-mix(in srgb, var(--a) 10%, transparent) 0 90px, transparent 91px), radial-gradient(circle at 0 100%, color-mix(in srgb, var(--b) 12%, transparent) 0 110px, transparent 111px); }
@keyframes unfold { from { opacity: 0; transform: translateY(80px) scale(.94) rotateX(18deg); } }
.letter > * { animation: line .7s var(--ease) both; }
.letter > :nth-child(1) { animation-delay: .25s; } .letter > :nth-child(2) { animation-delay: .4s; } .letter > :nth-child(3) { animation-delay: .55s; } .letter > :nth-child(4) { animation-delay: .7s; }
.letter > :nth-child(5) { animation-delay: .85s; } .letter > :nth-child(6) { animation-delay: 1s; } .letter > :nth-child(n+7) { animation-delay: 1.15s; }
@keyframes line { from { opacity: 0; transform: translateY(14px); } }
.to { text-align: center; color: var(--muted); font-size: 14px; margin: 0; }
h1 { text-align: center; font-size: 26px; font-weight: 900; margin: 6px 0 2px; line-height: 1.4;
  background: linear-gradient(135deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.orn { display: flex; align-items: center; gap: 10px; color: var(--a); margin: 8px auto 14px; max-width: 220px; }
.orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, currentColor, transparent); }
.msg { white-space: pre-line; text-align: center; font-size: 16px; margin: 0 0 18px; }
.count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 18px; }
.count div { text-align: center; padding: 8px 2px; border-radius: 14px; background: color-mix(in srgb, var(--a) 8%, #fff); }
.count b { display: block; font-size: 24px; font-weight: 800; color: var(--a); line-height: 1.3; font-variant-numeric: tabular-nums; }
.count span { font-size: 11.5px; color: var(--muted); }
.info { display: grid; gap: 10px; margin: 0 0 18px; }
.info div { display: flex; gap: 10px; align-items: flex-start; }
.info svg { flex: none; width: 22px; height: 22px; stroke: var(--a); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-top: 2px; }
.info b { display: block; font-weight: 700; } .info small { color: var(--muted); font-size: 13px; }
.acts { display: grid; gap: 8px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 14px; border: 0; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
  color: #fff; background: linear-gradient(135deg, var(--a), color-mix(in srgb, var(--a) 60%, var(--b))); box-shadow: 0 10px 22px -12px var(--a); transition: transform .2s var(--spring); }
.btn:active { transform: scale(.96); }
.btn.soft { background: color-mix(in srgb, var(--a) 10%, #fff); color: var(--a); box-shadow: none; }
.btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.sign { text-align: center; color: var(--muted); margin: 16px 0 0; font-size: 14px; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .petals { display: none; } }
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<main class="stage" id="stage">
  <div>
    <div class="env" id="env" role="button" tabindex="0" aria-label="باز کردن دعوت‌نامه">
      <div class="back"></div><div class="peek"></div><div class="front"></div><div class="flap"></div><div class="seal">💌</div>
    </div>
    <p class="hint">برای باز کردن، روی نامه بزنید</p>
  </div>
</main>
<script type="module" src="invite.js?v=2"></script>
</body>
</html>
